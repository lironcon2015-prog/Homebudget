name: Build offline HTML (portfolio)

on:
  push:
    branches: [main]
    paths:
      - invest/app.js
      - invest/app-v2.js
      - invest/src/**
      - invest/index.html
      - invest/icons/icon-192.png
      - invest/tailwind.config.js
      - invest/tools/build-offline.js
      - invest/tools/tailwind.input.css
      - invest/package.json
      - invest/package-lock.json
      - .github/workflows/invest-offline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a deploy token so the follow-up push triggers Pages.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: invest/package-lock.json

      # The portfolio keeps its own package.json under invest/, and the build
      # script shells out with cwd set there — so its dependencies have to be
      # installed there too, not at the repository root.
      - run: npm ci
        working-directory: invest

      # Every module is fetched as `module.js?v=<version>`, so a release that
      # does not move this string is served from cache and never reaches a
      # returning user. Bumping it here means shipping and cache-busting can
      # not drift apart the way they did when this was a manual step.
      - name: Bump patch version
        run: |
          current=$(jq -r .version invest/version.json)
          bumped=$(echo "$current" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          jq -n --arg v "$bumped" '{version: $v}' > invest/version.json
          echo "$current -> $bumped"

      - name: Build invest/dist/KidsPortfolio-Offline.html
        run: node invest/tools/build-offline.js

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- invest/dist/KidsPortfolio-Offline.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            git checkout -- invest/version.json
            exit 0
          fi
          git add invest/dist/KidsPortfolio-Offline.html invest/version.json
          git commit -m "ci: rebuild offline bundle ($(jq -r .version invest/version.json))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish offline-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-latest
          name: Offline build (latest)
          body: |
            Single-file offline build of Kids Portfolio. Download
            `KidsPortfolio-Offline.html` below and double-click it — no install,
            no server, no CDN dependency. Rebuilt automatically on every push
            to `main`.
          files: invest/dist/KidsPortfolio-Offline.html
          make_latest: true
