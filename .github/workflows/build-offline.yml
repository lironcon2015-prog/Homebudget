name: Build offline HTML

on:
  push:
    branches: [main]
    paths:
      - app.js
      - app-v2.js
      - src/**
      - index.html
      - icons/icon-192.png
      - tailwind.config.js
      - tools/build-offline.js
      - tools/tailwind.input.css
      - package.json
      - package-lock.json
      - version.json
      - .github/workflows/build-offline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a deploy token so the follow-up push triggers Pages.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build dist/JuniorInvest-Offline.html
        run: node tools/build-offline.js

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dist/JuniorInvest-Offline.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            exit 0
          fi
          git add dist/JuniorInvest-Offline.html
          git commit -m "ci: rebuild offline bundle ($(jq -r .version version.json))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish offline-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-latest
          name: Offline build (latest)
          body: |
            Single-file offline build of JuniorInvest. Download
            `JuniorInvest-Offline.html` below and double-click it — no install,
            no server, no CDN dependency. Rebuilt automatically on every push
            to `main`.
          files: dist/JuniorInvest-Offline.html
          make_latest: true
