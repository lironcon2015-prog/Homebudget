<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- The app's FAB gradient, so the icon reads as the same product. -->
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#cebdff"/>
      <stop offset="100%" stop-color="#45dfa4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.02" r="0.85">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#0F0C13"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Three ascending bars: a portfolio growing. Kept inside the central 60%
       so the maskable crop can't clip them. -->
  <g fill="url(#mark)">
    <rect x="272" y="560" width="130" height="200" rx="56"/>
    <rect x="447" y="440" width="130" height="320" rx="56"/>
    <rect x="622" y="300" width="130" height="460" rx="56"/>
  </g>
</svg>
