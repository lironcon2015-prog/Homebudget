<!DOCTYPE html>
<html class="dark" dir="rtl" lang="he">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<title>Kids Portfolio</title>

<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
<link rel="shortcut icon" href="./icons/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<!-- scope/start_url of "./" resolve to /invest/, which is what makes this
     install as its own app — separate icon, separate shell — even though it
     shares an origin with the budget app at the site root. -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kids Portfolio" />
<meta name="theme-color" content="#0F0C13" />

<script>
// This app now shares an origin with the budget app (it is served from
// /invest/ under the same host). Service workers and the Cache API are
// origin-wide, so the blanket "unregister every SW, delete every cache"
// cleanup that used to live here would tear down the HOST app's service
// worker and update mechanism on every visit to this screen. Anything this
// page needs to invalidate is handled per-URL by the versioned importmap in
// the bootstrap below, which is scoped to our own module graph.
//
// `embedded` marks the run inside the host app's iframe, so the UI can drop
// chrome the host already provides. Standalone (the installed mobile PWA)
// leaves the flag off and renders the full shell.
try {
  if (new URLSearchParams(location.search).get('embed') === '1' || window.top !== window.self) {
    document.documentElement.classList.add('embedded');
  }
} catch (_) { /* cross-origin top access — treat as standalone */ }
</script>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

<script id="tailwind-config">
  // Palette lifted from index.html so v2 reads as the same product.
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "surface": "#151219",
          "surface-container": "#221e26",
          "surface-container-low": "#1e1a22",
          "surface-container-lowest": "#100d14",
          "surface-container-high": "#2c2830",
          "background": "#0F0C13",
          "primary": "#cebdff",
          "primary-container": "#a78bfa",
          "on-primary": "#381385",
          "secondary": "#45dfa4",
          "on-secondary": "#003825",
          "tertiary": "#f9bd22",
          "error": "#ffb4ab",
          "outline": "#948e9d",
          "outline-variant": "#494552",
          "on-surface": "#e8e0eb",
          "on-surface-variant": "#cac4d4",
          "on-background": "#e8e0eb",
        },
        borderRadius: {
          DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem",
          "2xl": "1.25rem", "3xl": "1.75rem", full: "9999px",
        },
        fontFamily: {
          // Hanken Grotesk carries no Hebrew, so Latin text and every numeral
          // render in Hanken while Hebrew falls through to Assistant. That
          // fallback *is* the mechanism — do not reorder these.
          sans: ["Hanken Grotesk", "Assistant", "sans-serif"],
          heb: ["Assistant", "sans-serif"],
          data: ["Hanken Grotesk", "Assistant", "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  html { color-scheme: dark; }
  body {
    background-color: #0F0C13;
    color: #e8e0eb;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden; /* the hero orb bleeds sideways by design */
  }

  /* Until the icon font arrives the browser lays out the ligature *text*
     ("expand_more"), which is far wider than the glyph and wrecks every row it
     sits in. Reserving a 1em box keeps layout stable; hiding the span until
     the font is confirmed loaded means that text never paints at all, so
     there's no flash of clipped words on a cold load. */
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    user-select: none;
    display: inline-block;
    width: 1em;
    line-height: 1;
    white-space: nowrap;
    visibility: hidden;
  }
  html.icons-ready .material-symbols-outlined { visibility: visible; }
  .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 400; }

  bdi { unicode-bidi: isolate; }
  .font-data-tabular, .tnum { font-variant-numeric: tabular-nums; }

  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

  /* black-translucent runs the webview edge to edge, so the iOS clock and
     battery sit on top of the page. Content is inset below them, and a blurred
     strip keeps whatever scrolls past legible behind the status text. Both
     collapse to nothing where the inset is 0 (desktop, Android). */
  .safe-top { padding-top: env(safe-area-inset-top); }
  .status-scrim {
    position: fixed; inset: 0 0 auto 0;
    height: env(safe-area-inset-top);
    z-index: 46;
    background: rgba(15, 12, 19, 0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    pointer-events: none;
  }

  /* ---- Midnight Astral surfaces (ported from index.html) ---------------- */

  .glass-card {
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    border-top-color: rgba(255, 255, 255, 0.2);
    border-left-color: rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px rgba(0, 0, 0, 0.5);
    transition: background-color .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);
  }
  .glass-card:active { background: rgba(255, 255, 255, 0.06); }

  /* A radial gradient rather than a blurred child div: it inherits the card's
     border-radius, so the glow can never leak past a rounded corner. */
  .card-glow {
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: .6;
    z-index: 0;
  }
  .glass-card > :not(.card-glow) { position: relative; z-index: 1; }

  /* ---- Ambient atmosphere ------------------------------------------------ */

  /* Page-level, not dashboard-level. The orb used to sit behind the hero card
     alone, which is exactly what made the home screen read as a different app
     from the other three. Every screen now shares the same wash.
     No overflow clip: cutting a 90px-blurred circle at a container edge leaves
     a hard horizontal seam. It bleeds and fades on its own blur; body handles
     the horizontal axis. */
  .ambient-orb {
    position: fixed;
    top: -9rem; left: 50%;
    width: 26rem; height: 26rem;
    margin-left: -13rem;
    pointer-events: none;
    z-index: 0;
  }
  .ambient-orb .orb-violet {
    position: absolute; inset: 0;
    background: rgba(167, 139, 250, 0.26);
    border-radius: 9999px;
    filter: blur(90px);
    mix-blend-mode: screen;
  }
  .ambient-orb .orb-emerald {
    position: absolute;
    width: 15rem; height: 15rem;
    right: -3rem; bottom: -2rem;
    background: rgba(69, 223, 164, 0.16);
    border-radius: 9999px;
    filter: blur(80px);
    mix-blend-mode: screen;
  }

  .kid-progress-track {
    width: 100%; height: 2px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 9999px; overflow: hidden;
  }
  .kid-progress-fill { height: 100%; border-radius: 9999px; }

  /* Glowing FAB, matching the app's neon button treatment. */
  .fab-neon {
    background: linear-gradient(135deg, #cebdff, #45dfa4);
    border: 0.5px solid rgba(206, 189, 255, 0.4);
    box-shadow: 0 0 24px rgba(206, 189, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    color: #151219;
  }
  .fab-neon:active { filter: brightness(.95); transform: scale(.96); }

  /* Accordion: animate height without measuring in JS. */
  .accordion { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.16,1,.3,1); }
  .accordion.open { grid-template-rows: 1fr; }
  .accordion > div { overflow: hidden; }

  .chevron { transition: transform .32s cubic-bezier(.16,1,.3,1); }
  .chevron.open { transform: rotate(180deg); }

  .pressable { transition: background-color .18s ease, transform .18s ease; }
  .pressable:active { transform: scale(.985); }

  ::selection { background: rgba(206, 189, 255, 0.3); color: #151219; }

  /* iOS-style floating tab bar: a detached capsule, with the active tab held
     in its own filled pill rather than signalled by colour alone. */
  .tabbar {
    background: rgba(34, 30, 38, 0.72);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .tab-item { transition: color .2s ease, background-color .25s cubic-bezier(.16,1,.3,1); }
  .tab-item[aria-current="page"] {
    background: rgba(206, 189, 255, 0.16);
    box-shadow: inset 0 0 0 0.5px rgba(206, 189, 255, 0.3);
  }

  @keyframes ji-spin { to { transform: rotate(360deg); } }
  .spinning { animation: ji-spin .9s linear infinite; }

  /* Pull-to-refresh indicator (option 3). Sits above the content and is
     translated down as the drag progresses. */
  .pull-ind {
    position: fixed; top: env(safe-area-inset-top); left: 50%;
    margin-left: -1.25rem;
    width: 2.5rem; height: 2.5rem;
    display: grid; place-items: center;
    border-radius: 9999px;
    background: rgba(34, 30, 38, 0.9);
    border: 0.5px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    color: #cebdff;
    z-index: 45;
    opacity: 0;
    transform: translateY(-3rem);
    pointer-events: none;
  }

  /* Avatar cropper. The stage is a canvas drawn by the same routine that
     writes the exported file, so the preview cannot disagree with the result. */
  .crop-stage {
    position: relative; width: 280px; height: 280px;
    border-radius: 1rem; overflow: hidden; background: #0b0910;
    touch-action: none; user-select: none; cursor: grab;
  }
  .crop-stage canvas { position: absolute; inset: 0; display: block; width: 280px; height: 280px; }
  .crop-mask {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, transparent 0 120px, rgba(0,0,0,.62) 121px);
  }
  .crop-mask::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 240px; height: 240px; margin: -120px 0 0 -120px;
    border-radius: 9999px; border: 2px solid rgba(255,255,255,.55);
  }

  .sheet {
    background: rgba(21, 18, 25, 0.96);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border-top: 0.5px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.6);
    padding-bottom: env(safe-area-inset-bottom);
    animation: sheet-in .28s cubic-bezier(.16, 1, .3, 1);
  }
  @keyframes sheet-in { from { transform: translateY(14%); opacity: .6; } to { transform: none; opacity: 1; } }

  .toast {
    background: rgba(34, 30, 38, 0.95);
    border: 0.5px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  /* Native overscroll would fight the pull-to-refresh gesture on iOS. */
  body { overscroll-behavior-y: contain; }

  select, option { background-color: #100d14; color: #e8e0eb; }

  @media (prefers-reduced-motion: reduce) {
    .accordion, .chevron, .pressable, .tab-item { transition: none; }
    .animate-pulse, .spinning { animation: none; }
  }

  /* ===== OVERRIDING TAILWIND UTILITIES =====
     Everything below competes with a Tailwind class on the same element, and
     every selector here is therefore prefixed with `html` to outrank it.
     This is not decoration. The Tailwind CDN compiles and injects its <style>
     at RUNTIME, which puts it after this block in the document — so at equal
     specificity Tailwind wins on source order, and a plain `.app-shell` rule
     silently loses to `max-w-lg` with nothing in the console to show for it. */

  /* A drag gesture has no affordance with a mouse, so the header carries a
     refresh button instead — but only where there is a pointer to click it.
     On a phone the gesture is the better control and the button is noise.
     Competes with the button's own `grid` class. */
  html .pointer-fine-only { display: none; }
  @media (pointer: fine) { html .pointer-fine-only { display: grid; } }

  /* ===== WIDE LAYOUT =====
     This app is phone-first: one 32rem column, everything stacked. That column
     is also what the budget app's desktop shell embeds, where it turns into a
     narrow strip of content between two empty margins and far more scrolling
     than the screen needs.
     The breakpoint is on the VIEWPORT, which inside an iframe means the frame's
     own width — so the layout follows the space actually available rather than
     the size of the device behind it. */
  @media (min-width: 900px) {
    /* Competes with `max-w-lg` on the same element. */
    html .app-shell { max-width: 72rem; }

    /* auto-FIT, not auto-fill: empty tracks collapse, so two kids get half the
       row each instead of two-thirds and a gap.
       The max here has to stay `1fr`. Track COUNT is computed from the max
       track sizing function whenever that is definite, so a `minmax(18rem,
       24rem)` caps the count as if every track were 24rem — which is what
       silently left three kids on two rows. `1fr` is indefinite, so the count
       falls back to the 18rem minimum and three fit. The cap that keeps a lone
       card from spanning the whole row belongs on the card, below. */
    html .wide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
      gap: 1rem;
      align-items: start;
      justify-items: center;
    }
    html .wide-grid > * { width: 100%; max-width: 30rem; }

    /* The total-value card was a lot of empty space with a number in the
       corner. Across the width it reads better as a band: the headline value
       anchored at the start, the figures that qualify it lined up after. */
    html .summary-band {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }
    html .summary-hero { flex: 0 0 auto; }
    html .summary-value { font-size: 3rem; line-height: 1.1; }
    html .summary-stats {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    /* Spread the figures through the band rather than parking them at the far
       edge — grouped at one end they leave a dead gap in the middle of a card
       this wide. */
    html .summary-pills {
      margin-top: 0;
      flex: 1;
      justify-content: space-evenly;
    }
    /* The stacked spacing and the rule above the FX row belong to the phone
       layout; side by side they would be a stray line through the middle. */

    html .summary-fx {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: .25rem;
      border-inline-start: 1px solid rgba(255, 255, 255, .1);
      padding-inline-start: 2rem;
    }
    /* Tailwind's space-y-* puts margin on every child but the first. Inside a
       grid that stacks on top of the gap and knocks the rows out of line.
       Its selector is `.space-y-4 > :not([hidden]) ~ :not([hidden])`, and each
       :not() carries its argument's weight — so a plain `> * + *` is nowhere
       near enough to beat it. This mirrors its shape, plus `html`. */
    html .wide-grid > :not([hidden]) ~ :not([hidden]) { margin-top: 0; }

    /* The ledger is chronological — splitting it into columns would break the
       one thing its order is for. It gets the width it can use and no more. */
    html .wide-cap { max-width: 46rem; margin-inline: auto; }
  }
</style>
</head>

<body class="font-sans min-h-screen antialiased" dir="rtl">
  <!-- The app renders into this root; see the bootstrap below. -->
  <div id="v2-root"></div>

  <script>
    // Reveal icons only once the font is genuinely available, so a blocked or
    // slow icon font leaves a blank 1em box rather than raw "expand_more"
    // text. fonts.load() resolves with the faces it actually matched — unlike
    // fonts.check(), which tests a space glyph this font doesn't carry and so
    // reports false even on success. A rejection (network failure) simply
    // leaves the icons hidden.
    document.fonts.load('24px "Material Symbols Outlined"')
      .then((faces) => {
        if (faces.length) document.documentElement.classList.add('icons-ready');
      })
      .catch(() => {});
  </script>

  <script>
  // Cache-busting bootstrap.
  //
  // Two separate staleness problems, both of which bit after the v1 -> v2 swap:
  //
  // 1. Busting only the entry module leaves every module it imports on the
  //    cached copy, so a fresh app-v2.js would still pull an old ui-v2.js.
  //    An importmap rewrites the whole graph at once.
  // 2. The shell document itself is cached — an iOS home-screen webapp will
  //    serve it indefinitely, so nothing inside it ever runs to fix anything.
  //    Comparing the deployed version against the one in our own URL and
  //    replacing the URL forces a fetch under a cache key the stale entry
  //    doesn't occupy.
  //
  // A "no-cache" <meta http-equiv> does not do this: browsers ignore it for
  // HTTP caching decisions.
  (async () => {
    const MODULES = [
      './app-v2.js',
      './src/ui-v2.js',
      './src/state/LocalStoragePersistence.js',
      './src/state/StateManager.js',
      './src/view/Selectors.js',
      './src/ledger/LedgerEngine.js',
      './src/ledger/FifoEngine.js',
      './src/ledger/DividendEngine.js',
      './src/ledger/GemelEngine.js',
      './src/math/Xirr.js',
      './src/io/QuoteFetcher.js',
      './src/io/GemelFetcher.js',
      './src/io/DriveSync.js',
      './src/util/MathUtils.js',
      './src/util/EventBus.js',
      './src/util/IdGen.js'
    ];

    const showError = (msg, detail) => {
      document.getElementById('v2-root').innerHTML =
        '<pre dir="ltr" style="padding:1rem;color:#ffb4ab;white-space:pre-wrap;">'
        + msg + '\n' + (detail || '') + '</pre>';
    };

    // One-time handoff from the app's former origin (invest.lironcon.com).
    // localStorage is per-origin, so moving the app under the budget site's
    // host leaves the old data stranded — the old page hands it over in the
    // URL fragment, which (unlike the query string) is never sent to a server
    // and so keeps the ledger out of every access log on the way.
    //
    // This has to finish BEFORE the app module loads, because StateManager
    // reads persistence once at construction.
    await (async () => {
      const m = /(?:^|&)import=([^&]+)/.exec(location.hash.slice(1));
      if (!m) return;
      const gzipped = /(?:^|&)z=1(?:&|$)/.test(location.hash.slice(1));
      // Clear the fragment first: a payload that fails to apply must not sit in
      // the address bar to be retried on every subsequent reload.
      history.replaceState(null, '', location.pathname + location.search);
      try {
        const bin = Uint8Array.from(
          atob(m[1].replace(/-/g, '+').replace(/_/g, '/')),
          (c) => c.charCodeAt(0)
        );
        let json;
        if (gzipped) {
          const ds = new DecompressionStream('gzip');
          json = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
        } else {
          json = new TextDecoder().decode(bin);
        }
        const payload = JSON.parse(json);
        const incoming = payload['juniorinvest:v1'];
        if (typeof incoming !== 'string' || !JSON.parse(incoming).ledger) {
          throw new Error('payload חסר ledger');
        }
        const existing = localStorage.getItem('juniorinvest:v1');
        if (existing && existing !== incoming) {
          const ok = confirm(
            'נמצאו נתונים מהכתובת הקודמת, וגם נתונים קיימים כאן.\n' +
            'לייבא ולדרוס את הנתונים הקיימים?'
          );
          if (!ok) return;
        }
        for (const [k, v] of Object.entries(payload)) {
          if (k.startsWith('juniorinvest:') && typeof v === 'string') localStorage.setItem(k, v);
        }
      } catch (e) {
        alert('ייבוא הנתונים מהכתובת הקודמת נכשל:\n' + (e && e.message) +
              '\n\nהנתונים בכתובת הישנה לא נמחקו — אפשר לייצא משם JSON ולייבא כאן.');
      }
    })();

    const http = location.protocol.startsWith('http');
    let deployed = null;
    if (http) {
      try {
        const r = await fetch('./version.json?_=' + Date.now(), { cache: 'no-store' });
        deployed = (await r.json()).version;
      } catch (e) { /* offline: keep whatever is cached rather than looping */ }
    }

    // Only redirect when we actually know the deployed version. Falling back to
    // a timestamp here would never match and would reload forever.
    if (deployed) {
      const params = new URLSearchParams(location.search);
      if (params.get('v') !== deployed) {
        // Rewrite only the version, preserving every other parameter. Rebuilding
        // the query from scratch used to drop `embed=1`, so the very first load
        // inside the host app bounced itself back out of embedded mode.
        params.set('v', deployed);
        location.replace(location.pathname + '?' + params.toString() + location.hash);
        return;
      }
    }

    const v = deployed || String(Date.now());
    try {
      if (http) {
        const map = { imports: Object.fromEntries(MODULES.map((p) => [p, p + '?v=' + v])) };
        const el = document.createElement('script');
        el.type = 'importmap';
        el.textContent = JSON.stringify(map);
        document.head.appendChild(el);
      }

      window.JI_APP_VERSION = v;
      const app = document.createElement('script');
      app.type = 'module';
      // A file:// URL treats "?v=..." as part of the filename and 404s, so the
      // query is only ever added over http(s).
      app.src = http ? './app-v2.js?v=' + v : './app-v2.js';
      app.onerror = (e) => showError('כשל בטעינת app-v2.js (גרסה ' + v + ')', String(e));
      document.body.appendChild(app);
    } catch (e) {
      showError('כשל בבוטסטרפ:', (e && e.stack) || String(e));
    }
  })();
  </script>
</body>
</html>
